      两新格的 Br 必然与标准格不同（Br=b*mu 是恒等式，固定 Br 则 2x2 退化），
      因此 mu16@b=512 的数据量是标准格的 2x（题池复用 2.25x -> 4.1x），
      mu8@b=256 是 0.5x（复用 -> 1.0x）。这是二阶混淆，写作时必须声明：
      第 4 格偏乐观、第 3 格偏保守，两者对「b 是主因」的方向相反。
      evidence 指向脚本而非它的输出：analysis/out/ 不入库（.gitignore）。
      这条**可被第三方独立复算**，且输入就在本仓库：4096 那两格在 runs/，
      两个新预算格在 runs_ab2x2/。克隆后直接跑：
      python analysis/bmu_2x2.py --runs runs --ab runs_ab2x2 \
        --json analysis/out/bmu_2x2.json
      2026-10-27 用这条路径复跑校验：HEADLINE = mu_is_primary，四格
      0.4593 / 0.5168 / 0.4383 / 0.5671，交互 +2.93pp [-3.67,+9.53]，与上文逐位一致。


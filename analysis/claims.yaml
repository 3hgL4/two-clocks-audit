      （82bbd063...）——mu 依赖在起点不存在，只在训练后出现。
      evidence 指向脚本而非它的输出：analysis/out/ 不入库（.gitignore），落盘结果
      已在上文逐值抄录。但本条与 C10/C11/C12 不同——它**不能由第三方独立复算**：
      脚本需要 (1) base 权重 _models/Qwen3-1.7B-Base（3.2 GiB）、(2) 三个 adapter
      r000/r003/r007（各 266 MiB）、(3) 一块 GPU，三者都不入库；且主副本
      runs/mu1_s0/adapters/ 目录本身不存在（权重只在归档副本 20_实验数据/ 下）。

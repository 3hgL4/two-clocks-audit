# 预注册声明（pre-registration）
#
# 这个文件在跑任何 GPU 之前写定。每条 claim 给出 id / 一句话 / 证据路径 / 证据字段 /
# 状态。跑完之后只允许改 status 和 values，不允许改措辞或阈值——否则就是事后选指标。
#
# status 描述「判据与实测的关系」，不描述「论文对不对」：
#   verified        已核实：判据成立，evidence 必须存在且字段存在且非空
#   falsified       已核实：判据不成立（方向相反或未达阈值），evidence 要求同上
#   unidentifiable  已核实：判据不可触发（阈值两端均删失，判定量根本不存在），evidence 要求同上
#   default         默认执行的可逆工程决定
#   pending         待拍板 / 待数据，禁止在 REPORT 里当作事实陈述
#
# 为什么 falsified / unidentifiable 不并进 verified：2026-10-27 回填时，七条预注册
# 判据里有三条落在「判据不成立」（C2 单调、C4 方向、C6 后半）、一条落在「不可触发」
# （C3）。若都记 verified，读者会把 verified 读成「预测成立」——这正是本文件要防的事。
#
# 校验：python analysis/trace.py --strict


# Two Clocks audit -- base configuration.
#
# Every number here is either (a) taken from arXiv:2610.18853 with its location
# recorded in REPORT.md, or (b) a documented deviation. Editing anything that
# changes the arm definition invalidates the pre-registered comparison, so
# deviations go into REPORT.md, never silently into this file.

run:
  tag: base
  seed: 0
  out_dir: runs
  note: ""

data:
  pool: data/prompts_mixed2000.jsonl
  # frozen at generation time; a mismatch aborts the run.
  # NB: the hash is over LF-normalised bytes (`.gitattributes: * text=auto eol=lf`),
  # so it must match the blob, not a CRLF working copy. See DEVLOG D-09.
  sha256: "d781f955ad9773cc0107fd171b2371ea3bec262a2021b6e8e481da81f64a798b"

model:
  name: Qwen/Qwen3-1.7B-Base
  stub: false
  dtype: bfloat16
  attn_implementation: sdpa
  gradient_checkpointing: true
  lora:
    r: 64
    alpha: 16
    dropout: 0.0

train:
  num_rollouts: 8             # 8 x 4096 = 32768 responses per run
  num_generations: 8          # G, paper Table 1
  responses_per_rollout: 4096 # Br, paper L tier
  mu: 1                       # optimizer steps per rollout -- the manipulated variable
  micro_batch_responses: 8    # forward/backward chunk; logits memory ~ micro * len * vocab
  max_completion_length: 512
  temperature: 1.0
  top_p: 1.0
  lr: 5.0e-5
  weight_decay: 0.0
  warmup_ratio: 0.1
  grad_clip: 1.0
  eps_low: 0.2                # paper: dual-segment clip (0.2, 0.28)
  eps_high: 0.28
  clip_delta: 10.0            # paper: dual clip 10
  loss_norm: token_mean

rollout:
  backend: vllm               # fake | hf | vllm
  vllm:
    gpu_memory_utilization: 0.45
    max_num_seqs: 256
    enable_lora: true
    adapter_dir: runs/_adapter
    offload_policy: false
    enforce_eager: false        # true on images without nvcc; see cloud24g.yaml

accounting:
  price_cny_per_hour: 1.50    # RTX 4090-24G
  gpu_type: 4090-24G

logging:
  flush_every: 1
  save_state_every_rollouts: 1
  log_rollout_samples: 8

drift:
  kappa: 1.0                  # unit convention only; cancels in every ratio

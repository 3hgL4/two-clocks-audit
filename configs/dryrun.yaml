# CPU dry-run: no GPU, no downloads, no network.
#
# A 2-layer / 64-hidden random model with a 512-token character tokenizer plays
# the role of Qwen3-1.7B, and the fake backend plays the role of vLLM. Every
# code path is still executed: rollout -> advantage -> log-prob forward ->
# backward -> gradient accumulation -> sigma -> clipping -> optimizer step ->
# metrics validation -> checkpoint -> resume.
#
#   python src/train.py --config configs/dryrun.yaml --device cpu
#
# Cost: 0 GPU-hours. Runtime: well under a minute on a laptop CPU.
extends: base.yaml
run:
  tag: dryrun
  seed: 7
model:
  name: stub
  stub: true
  dtype: float32
  attn_implementation: eager
  gradient_checkpointing: false
train:
  num_rollouts: 2
  num_generations: 8
  responses_per_rollout: 64
  mu: 2
  micro_batch_responses: 4
  max_completion_length: 64
  lr: 1.0e-3
  warmup_ratio: 0.0
rollout:
  backend: fake
logging:
  log_rollout_samples: 4
